<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Form Scanner & Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
    <!-- Header -->
    <div class="mb-4 text-center">
      <h1 class="text-xl font-bold tracking-tight text-white">Smart Form Validator</h1>
      <p class="text-xs text-slate-400 mt-1">Real-time mandatory field scanner with audio alert</p>
    </div>

    <!-- API Key Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Anthropic API Key</label>
      <input 
        id="apiKeyInput" 
        type="password" 
        placeholder="sk-ant-api03-..." 
        class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500 font-mono"
      />
      <p class="text-[10px] text-slate-500 mt-1">Direct client calls require CORS proxy or direct development use.</p>
    </div>

    <!-- Camera Viewport -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-slate-700 shadow-inner flex items-center justify-center">
      <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="snapshotCanvas" class="hidden"></canvas>

      <!-- Document Guideline Overlay -->
      <div class="absolute inset-4 border-2 border-dashed border-white/40 rounded-lg pointer-events-none flex items-center justify-center">
        <span class="text-white/40 text-xs font-medium tracking-wide">Align Form Inside Border</span>
      </div>

      <!-- Scanning Indicator -->
      <div id="scanIndicator" class="hidden absolute inset-0 bg-indigo-950/60 backdrop-blur-xs flex flex-col items-center justify-center text-center p-4">
        <div class="w-8 h-8 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-2"></div>
        <p class="text-sm font-semibold text-indigo-200">Analyzing Form Details...</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="mt-4 flex gap-2">
      <button 
        id="startCameraBtn" 
        class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-[0.98] py-2.5 rounded-lg font-medium text-xs transition"
      >
        Start Camera
      </button>
      <button 
        id="captureBtn" 
        disabled 
        class="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:opacity-50 active:scale-[0.98] py-2.5 rounded-lg font-semibold text-xs tracking-wide text-white transition shadow-lg shadow-indigo-600/20"
      >
        Scan & Verify
      </button>
    </div>

    <!-- Result / Status Box -->
    <div id="statusCard" class="mt-5 p-4 rounded-xl border border-slate-700/60 bg-slate-950/50 hidden">
      <div class="flex items-center gap-2 mb-2">
        <span id="statusIcon" class="text-lg"></span>
        <h3 id="statusTitle" class="text-sm font-bold"></h3>
      </div>
      <p id="statusMsg" class="text-xs text-slate-300 leading-relaxed"></p>

      <!-- Dynamic list of missing/verified fields -->
      <div id="fieldBreakdown" class="mt-3 space-y-1.5 border-t border-slate-800 pt-3"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('snapshotCanvas');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const scanIndicator = document.getElementById('scanIndicator');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusIcon = document.getElementById('statusIcon');
    const statusMsg = document.getElementById('statusMsg');
    const fieldBreakdown = document.getElementById('fieldBreakdown');

    let stream = null;

    // 1. Browser Web Audio API Beep Generator (Two short alert tones)
    function playMissingFieldAlert() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const playTone = (freq, startTime, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        const now = audioCtx.currentTime;
        playTone(880, now, 0.12);        // First Beep (880Hz - A5)
        playTone(880, now + 0.18, 0.16); // Second Beep
      } catch (err) {
        console.error("Audio playback error:", err);
      }
    }

    // 2. Camera Access Setup
    startCameraBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = stream;
        captureBtn.disabled = false;
        startCameraBtn.classList.add('hidden');
      } catch (err) {
        alert("Camera permission denied or camera not found: " + err.message);
      }
    });

    // 3. Capture Frame & Trigger Claude Verification
    captureBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please enter your Anthropic API Key first.");
        apiKeyInput.focus();
        return;
      }

      // Draw snapshot from video feed
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Convert canvas to base64 JPEG (without prefix)
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, "");

      // Lock UI
      scanIndicator.classList.remove('hidden');
      captureBtn.disabled = true;

      try {
        const result = await verifyDocumentWithClaude(apiKey, base64Data);
        renderScanResults(result);
      } catch (error) {
        console.error(error);
        showErrorUI(error.message);
      } finally {
        scanIndicator.classList.add('hidden');
        captureBtn.disabled = false;
      }
    });

    // 4. Anthropic API Call
    async function verifyDocumentWithClaude(apiKey, base64Image) {
      const prompt = `Inspect this document image carefully. Verify if the following mandatory fields are present and properly filled:
1. Full Name
2. Mobile Number / Phone
3. Signature / Thumb Impression
4. Date

Check whether each item is completed, empty, or missing entirely.
Return your evaluation ONLY as a valid JSON object matching this schema without any markdown formatting or commentary:
{
  "allMandatoryFilled": boolean,
  "missingFields": ["field name"],
  "fieldStatus": {
    "FullName": "filled" | "missing",
    "MobileNumber": "filled" | "missing",
    "Signature": "filled" | "missing",
    "Date": "filled" | "missing"
  },
  "notes": "Short description of detected problems"
}`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "content-type": "application/json",
          "dangerously-allow-browser": "true"
        },
        body: JSON.stringify({
          model: "claude-3-5-sonnet-20241022",
          max_tokens: 600,
          messages: [
            {
              role: "user",
              content: [
                {
                  type: "image",
                  source: {
                    type: "base64",
                    media_type: "image/jpeg",
                    data: base64Image
                  }
                },
                {
                  type: "text",
                  text: prompt
                }
              ]
            }
          ]
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || "API request failed");
      }

      const resJson = await response.json();
      let rawText = resJson.content[0].text.trim();

      // Clean markdown wrap if returned
      if (rawText.startsWith("```")) {
        rawText = rawText.replace(/```json|```/g, "").trim();
      }

      return JSON.parse(rawText);
    }

    // 5. Render Response & Trigger Alert
    function renderScanResults(data) {
      statusCard.classList.remove('hidden');
      fieldBreakdown.innerHTML = "";

      if (!data.allMandatoryFilled) {
        // TRIGGER BEEP
        playMissingFieldAlert();

        // Update UI styling for Missing Fields Error
        statusCard.className = "mt-5 p-4 rounded-xl border border-red-500/60 bg-red-950/20";
        statusIcon.textContent = "⚠️";
        statusTitle.textContent = "Mandatory Fields Missing!";
        statusTitle.className = "text-sm font-bold text-red-400";
        statusMsg.textContent = data.notes || "One or more required fields are unfilled.";
      } else {
        // Form is complete
        statusCard.className = "mt-5 p-4 rounded-xl border border-emerald-500/60 bg-emerald-950/20";
        statusIcon.textContent = "✅";
        statusTitle.textContent = "All Fields Verified";
        statusTitle.className = "text-sm font-bold text-emerald-400";
        statusMsg.textContent = "All mandatory sections are populated correctly.";
      }

      // Populate list items
      if (data.fieldStatus) {
        Object.entries(data.fieldStatus).forEach(([field, status]) => {
          const isFilled = status === "filled";
          const row = document.createElement("div");
          row.className = "flex items-center justify-between text-xs py-1 px-2 rounded bg-slate-900/60";
          row.innerHTML = `
            <span class="font-medium ${isFilled ? 'text-slate-300' : 'text-red-300 font-semibold'}">${field}</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
              isFilled ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800 animate-pulse'
            }">${status}</span>
          `;
          fieldBreakdown.appendChild(row);
        });
      }
    }

    function showErrorUI(msg) {
      statusCard.classList.remove('hidden');
      statusCard.className = "mt-5 p-4 rounded-xl border border-amber-500/60 bg-amber-950/20";
      statusIcon.textContent = "❗";
      statusTitle.textContent = "Verification Failed";
      statusTitle.className = "text-sm font-bold text-amber-400";
      statusMsg.textContent = msg;
      fieldBreakdown.innerHTML = "";
    }
  </script>
</body>
</html>
