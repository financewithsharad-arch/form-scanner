<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Fund Form Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
    <div class="mb-4 text-center">
      <h1 class="text-xl font-bold tracking-tight text-white">MF Form Validator</h1>
      <p class="text-xs text-slate-400 mt-1">Automatic Mandatory Fields & Signature Checker</p>
    </div>

    <!-- API Key Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Gemini API Key</label>
      <input 
        id="apiKeyInput" 
        type="password" 
        placeholder="AIzaSy..." 
        class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-blue-500 font-mono"
      />
    </div>

    <!-- Camera Box -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-slate-700 shadow-inner flex items-center justify-center">
      <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="snapshotCanvas" class="hidden"></canvas>

      <div class="absolute inset-4 border-2 border-dashed border-white/40 rounded-lg pointer-events-none flex items-center justify-center">
        <span class="text-white/40 text-xs font-medium tracking-wide">Align MF Form Inside</span>
      </div>

      <!-- Scanning Spinner -->
      <div id="scanIndicator" class="hidden absolute inset-0 bg-blue-950/75 backdrop-blur-xs flex flex-col items-center justify-center text-center p-4">
        <div class="w-8 h-8 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-2"></div>
        <p class="text-sm font-semibold text-blue-200">Checking Form Mandatory Fields...</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="mt-4 flex gap-2">
      <button 
        id="startCameraBtn" 
        class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-[0.98] py-2.5 rounded-lg font-medium text-xs transition"
      >
        Start Camera
      </button>
      <button 
        id="captureBtn" 
        disabled 
        class="flex-1 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:opacity-50 active:scale-[0.98] py-2.5 rounded-lg font-semibold text-xs tracking-wide text-white transition shadow-lg shadow-blue-600/20"
      >
        Scan & Verify
      </button>
    </div>

    <!-- Status Card -->
    <div id="statusCard" class="mt-5 p-4 rounded-xl border border-slate-700/60 bg-slate-950/50 hidden">
      <div class="flex items-center gap-2 mb-2">
        <span id="statusIcon" class="text-lg"></span>
        <h3 id="statusTitle" class="text-sm font-bold"></h3>
      </div>
      <p id="statusMsg" class="text-xs text-slate-300 leading-relaxed"></p>
      <div id="fieldBreakdown" class="mt-3 space-y-1.5 border-t border-slate-800 pt-3"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('snapshotCanvas');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const scanIndicator = document.getElementById('scanIndicator');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusIcon = document.getElementById('statusIcon');
    const statusMsg = document.getElementById('statusMsg');
    const fieldBreakdown = document.getElementById('fieldBreakdown');

    // Auto-load saved API key
    if (localStorage.getItem("saved_gemini_api_key")) {
      apiKeyInput.value = localStorage.getItem("saved_gemini_api_key");
    }

    // Beep Alert Audio (2 loud beeps)
    function playMissingFieldAlert() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square'; // louder alert tone
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + start);
          osc.stop(audioCtx.currentTime + start + duration);
        };

        playTone(950, 0, 0.15);
        playTone(950, 0.22, 0.2);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    startCameraBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } }
        });
        video.srcObject = stream;
        captureBtn.disabled = false;
        startCameraBtn.classList.add('hidden');
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    });

    captureBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please enter your Gemini API Key.");
        apiKeyInput.focus();
        return;
      }
      localStorage.setItem("saved_gemini_api_key", apiKey);

      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      scanIndicator.classList.remove('hidden');
      captureBtn.disabled = true;

      try {
        const result = await verifyWithGemini(apiKey, base64Data);
        renderScanResults(result);
      } catch (err) {
        console.error(err);
        showErrorUI(err.message);
      } finally {
        scanIndicator.classList.add('hidden');
        captureBtn.disabled = false;
      }
    });

    async function verifyWithGemini(apiKey, base64Image) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const prompt = `You are an expert Mutual Fund Operations auditor checking this physical application form.
Inspect the visible page of this Mutual Fund Application / SIP Mandate / OTM Form carefully.

Check whether the visible mandatory fields on this page are properly filled or empty/blank:
Possible Mandatory Fields by section:
- Applicant Details: "Applicant Name", "PAN", "DOB", "Mobile Number", "Email ID", "Tax Status"
- Bank Account Details: "Bank Name", "Bank Account Number", "IFSC Code", "Bank Branch/City"
- Investment Details: "Scheme / Plan", "Amount", "Cheque / UTR No", "Payment Date"
- SIP Details (if SIP form): "SIP Frequency", "SIP Date", "SIP Amount", "SIP Period"
- OTM Mandate (if visible): "Bank Account Number", "IFSC", "Amount Limit", "Applicant Signature"
- Nomination (if visible): "Nominee Name", "Nominee Relation", "Nominee Share %", "Identity Details"
- Signatures: "Investor Signature(s)"

Rules:
1. Only evaluate fields that exist on the visible page captured in the image.
2. If a field exists on this page and is BLANK/EMPTY, label it "missing".
3. If it is filled or signed, label it "filled".
4. If a field is not on this specific captured page, DO NOT include it.

Output ONLY valid JSON matching this schema:
{
  "allMandatoryFilled": false,
  "detectedPage": "Applicant Info / Bank / SIP / Nomination / Signatures",
  "fieldStatus": {
    "FieldName": "filled" or "missing"
  },
  "notes": "Short description of missing mandatory items"
}`;

      const requestBody = {
        contents: [
          {
            parts: [
              { text: prompt },
              {
                inline_data: {
                  mime_type: "image/jpeg",
                  data: base64Image
                }
              }
            ]
          }
        ],
        generationConfig: {
          response_mime_type: "application/json"
        }
      };

      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || "Gemini API Request failed");
      }

      const data = await response.json();
      return JSON.parse(data.candidates[0].content.parts[0].text.trim());
    }

    function renderScanResults(data) {
      statusCard.classList.remove('hidden');
      fieldBreakdown.innerHTML = "";

      if (!data.allMandatoryFilled) {
        playMissingFieldAlert(); // Beep Alert trigger
        statusCard.className = "mt-5 p-4 rounded-xl border border-red-500/60 bg-red-950/20";
        statusIcon.textContent = "⚠️";
        statusTitle.textContent = "Mandatory Details Missing!";
        statusTitle.className = "text-sm font-bold text-red-400";
        statusMsg.textContent = `${data.detectedPage ? '[' + data.detectedPage + '] ' : ''}${data.notes || "Please check unfilled fields."}`;
      } else {
        statusCard.className = "mt-5 p-4 rounded-xl border border-emerald-500/60 bg-emerald-950/20";
        statusIcon.textContent = "✅";
        statusTitle.textContent = "Page Verified Complete";
        statusTitle.className = "text-sm font-bold text-emerald-400";
        statusMsg.textContent = "All visible mandatory sections on this page are filled.";
      }

      if (data.fieldStatus) {
        Object.entries(data.fieldStatus).forEach(([field, status]) => {
          const isFilled = status === "filled";
          const row = document.createElement("div");
          row.className = "flex items-center justify-between text-xs py-1.5 px-2 rounded bg-slate-900/60";
          row.innerHTML = `
            <span class="font-medium ${isFilled ? 'text-slate-300' : 'text-red-300 font-semibold'}">${field}</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
              isFilled ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800 animate-pulse'
            }">${status}</span>
          `;
          fieldBreakdown.appendChild(row);
        });
      }
    }

    function showErrorUI(msg) {
      statusCard.classList.remove('hidden');
      statusCard.className = "mt-5 p-4 rounded-xl border border-amber-500/60 bg-amber-950/20";
      statusIcon.textContent = "❗";
      statusTitle.textContent = "Scan Error";
      statusTitle.className = "text-sm font-bold text-amber-400";
      statusMsg.textContent = msg;
    }
  </script>
</body>
</html>
